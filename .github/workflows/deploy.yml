name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html style.css CNAME assets projects publications _site/
          touch _site/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
